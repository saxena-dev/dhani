[package]
name = "dhani"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
authors = ["Paresh Saxena <pareshsaxena@gmail.com>"]
description = "Asynchronous client library for DhanHQ trading API"
license = "MIT"
readme = "README.md"
repository = "https://github.com/saxena-dev/dhani"
keywords = ["dhanhq", "trading", "broker", "websocket"]
categories = ["api-bindings", "finance", "asynchronous"]
exclude = [
    "DhanHQ-py/",
    "tests/",
    "examples/",
    "benches/",
    "docs/",
    ".ignore/",
    ".beads/",
    ".agents/",
    ".claude/",
    ".codex/",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["rest", "feed"]
rest = ["dep:reqwest", "dep:percent-encoding", "dep:tokio", "tokio/time", "tokio/sync"]
feed = [
    "decoder",
    "dep:tokio",
    "tokio/rt",
    "tokio/net",
    "tokio/sync",
    "tokio/time",
    "tokio/macros",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:rustls",
    "dep:webpki-roots",
]
decoder = []
instruments = ["rest", "dep:csv"]
metrics = ["dep:metrics"]
decimal = ["dep:rust_decimal"]
live-tests = []

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0"
tracing = "0.1.44"
secrecy = "0.10.3"
url = "2.5.8"
# rest
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "query", "gzip", "http2"], optional = true }
percent-encoding = { version = "2.3.2", optional = true }
tokio = { version = "1.52", default-features = false, optional = true }
# feed
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"], optional = true }
futures-util = { version = "0.3.32", default-features = false, features = ["sink", "std"], optional = true }
rustls = { version = "0.23.36", default-features = false, features = ["aws_lc_rs", "std", "tls12"], optional = true }
webpki-roots = { version = "1.0.5", optional = true }
# optional extras
csv = { version = "1.4.0", optional = true }
metrics = { version = "0.24.6", optional = true }
rust_decimal = { version = "1.42.1", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
tokio = { version = "1.52", features = ["full", "test-util"] }
wiremock = "0.6.5"
tracing-subscriber = { version = "0.3.22", features = ["registry", "fmt", "env-filter"] }
metrics-util = "0.20.4"
sha2 = "0.10.9"
hex = "0.4.3"
toml = "1"
