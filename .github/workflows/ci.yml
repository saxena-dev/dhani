# Required checks. scripts/verify.sh runs the same commands locally.
# CI never fetches or hashes DhanHQ documentation and never runs the live test lane.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    # bash -eo pipefail: a failing command anywhere in a pipeline fails the step.
    shell: bash

jobs:
  test:
    name: test (${{ matrix.toolchain }}, ${{ matrix.row.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.88", stable]
        row:
          - { name: "no features", args: "--no-default-features" }
          - { name: decoder, args: "--no-default-features --features decoder" }
          - { name: rest, args: "--no-default-features --features rest" }
          - { name: feed, args: "--no-default-features --features feed" }
          - { name: "rest,instruments", args: "--no-default-features --features rest,instruments" }
          - { name: "all features", args: "--all-features" }
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init vendor/DhanHQ-py
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo test --locked ${{ matrix.row.args }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init vendor/DhanHQ-py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo doc --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings
      - run: cargo test --locked --doc --all-features

  dependency-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Each step captures the crate list first so that a cargo failure fails the step.
      - name: decoder row has no tokio, reqwest or tungstenite
        run: |
          names=$(cargo tree --locked --no-default-features --features decoder -e normal --prefix none --format '{p}' | awk '{print $1}')
          if grep -xE 'tokio|reqwest|tungstenite|tokio-tungstenite' <<<"$names"; then echo "forbidden dependency in this row" >&2; exit 1; fi
      - name: rest row has no tungstenite
        run: |
          names=$(cargo tree --locked --no-default-features --features rest -e normal --prefix none --format '{p}' | awk '{print $1}')
          if grep -xE 'tungstenite|tokio-tungstenite' <<<"$names"; then echo "forbidden dependency in this row" >&2; exit 1; fi
      - name: feed row has no reqwest
        run: |
          names=$(cargo tree --locked --no-default-features --features feed -e normal --prefix none --format '{p}' | awk '{print $1}')
          if grep -xE 'reqwest' <<<"$names"; then echo "forbidden dependency in this row" >&2; exit 1; fi
