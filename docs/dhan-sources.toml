# DhanHQ documentation sources cited by this repository.
#
# Citation forms used in source, tests and docs:
#   DOC:<a> or DOC:<a>-<b>   1-based line(s) in the documentation export named by [snapshot];
#                            the export itself is never committed. Each [[page]] records where
#                            its per-page Markdown sits inside the export (export_lines), so a
#                            DOC range resolves to the official page(s) it came from.
#   OAS:<METHOD> <path>      an operation in the OpenAPI spec named by [openapi], or
#   OAS:#/components/schemas/<Name>  a schema in it.
#   LEGACY:<name>            a page of the older HTML site, listed as a [[legacy]] entry; it is
#                            compared by the sha256 of its whitespace-normalised <article> text.
#
# Every page is served as Markdown: a page at https://docs.dhanhq.co/<path> is available at
# https://docs.dhanhq.co/markdown/<path>.md. sha256, bytes and lines identify the exact bytes
# fetched from url at accessed.
#
# tests/references.rs checks, offline and without hashing anything, that every citation in
# the repository resolves against this manifest. scripts/verify-dhan-sources.sh re-fetches
# every source (or reads a local mirror with --offline) and reports drift for human review.

